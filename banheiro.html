<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>banheiro</title>
</head>
<style>
    body {
        /* Insira o caminho correto da sua imagem PNG */
    background-image: url('banheiro.png');
    
    /* Evita que a imagem fique se repetindo na tela */
    background-repeat: no-repeat;
    
    /* Centraliza a imagem no fundo */
    background-position: center center;
    
    /* Faz a imagem cobrir toda a tela proporcionalmente */
    background-size: cover;
    
    /* Mantém a imagem fixa ao rolar a página (opcional) */
    background-attachment: fixed;
        
    color: white;
    }
</style>
<body>
    <h1>VOCÊ ESTÁ NO BANHEIRO</h1>

</body>
